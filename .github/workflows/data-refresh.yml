name: Weekly data refresh

# Downloads every source again, rebuilds the indicator files and opens a pull request
# with the diff. Nothing is merged automatically; Vercel deploys after a person merges.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch sources
        id: fetch
        # Partial failures still produce a PR for the sources that worked; the log lists failures.
        continue-on-error: true
        run: npm run pipeline:fetch 2>&1 | tee fetch.log
      - name: Transform
        run: npm run pipeline:transform 2>&1 | tee transform.log
      - name: Validate and test
        run: npm run validate && npm test
      - name: Pull request body
        run: |
          {
            echo "Automated weekly refresh. Review the changes before merging."
            echo
            echo "### Latest values (• = changed)"
            echo '```'
            grep -E '^[ •] ' transform.log || true
            echo '```'
            echo
            echo "### Fetch log"
            echo '```'
            tail -n 80 fetch.log
            echo '```'
          } > pr-body.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data-refresh
          delete-branch: true
          title: "Data refresh ${{ github.run_id }}"
          commit-message: "Weekly data refresh"
          body-path: pr-body.md
          add-paths: |
            data/raw
            data/indicators
            data/sources.json
          labels: data
